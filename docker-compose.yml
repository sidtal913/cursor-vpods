services:
  postgres:
    image: postgres:16-alpine
    container_name: vpods-hire-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vpods
      POSTGRES_PASSWORD: vpods_dev_password
      POSTGRES_DB: vpods_hire
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpods -d vpods_hire"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
